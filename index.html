<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="আয়-ব্যয় ব্যবস্থাপনা ও সঞ্চয় ট্র্যাকার" />
  <title>আয়-ব্যয় ব্যবস্থাপনা</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=15.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3b82f6" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="আয়-ব্যয়">
  <link rel="apple-touch-icon" href="Image.png">

  <!-- Chart.js + plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.44.0/dist/apexcharts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <script>
    (function registerChartPlugins() {
      const tryRegister = () => {
        if (typeof Chart === 'undefined') return;
        const plugin = window['chartjs-plugin-annotation'];
        if (plugin && typeof Chart.register === 'function') {
          try { Chart.register(plugin); } catch (e) { console.warn('annotation register:', e); }
        }
        if (window.ChartDataLabels && typeof Chart.register === 'function') {
          try { Chart.register(window.ChartDataLabels); } catch (e) { console.warn('datalabels register:', e); }
        }
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryRegister);
      } else {
        tryRegister();
      }
    })();
  </script>

  <!-- 🔧 Firebase v9.22.2 (login.html-এর সাথে match) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <header class="mobile-topbar">
    <button id="menu-toggle" aria-label="মেনু">
      <i class="fas fa-bars"></i>
    </button>
    <div class="mobile-title">লোড হচ্ছে...</div>
  </header>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">
        <i class="fas fa-wallet" style="color: #3b82f6;"></i>
        <span>আয়-ব্যয় ব্যবস্থাপনা</span>
      </div>
    </div>

    <div id="user-name" role="button" tabindex="0" title="প্রোফাইল দেখুন" aria-label="প্রোফাইল দেখুন">
      <i class="fas fa-user-circle" style="font-size: 2.2rem; color: var(--primary);"></i>
      <div class="profile-name-row">
        <strong>লোড হচ্ছে...</strong>
        <i class="fas fa-sign-in-alt"></i>
      </div>
    </div>

    <div class="theme-toggle-wrapper">
      <span id="theme-label">ডিফল্ট থিম</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" aria-label="থিম পরিবর্তন">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="savings-toggle-wrapper">
      <span>সেভিংস চালু</span>
      <label class="switch">
        <input type="checkbox" id="savings-toggle" checked aria-label="সেভিংস চালু বা বন্ধ">
        <span class="slider round"></span>
      </label>
    </div>

    <div id="today-saving-status"><span>লোড হচ্ছে...</span></div>

    <button id="mark-saving-btn" style="display:none;">আজকের সঞ্চয় সম্পন্ন করলাম</button>

    <nav id="topbar">
      <div class="menu-row">
        <button class="menu-button active" id="nav-dashboard"><i class="fas fa-home"></i> ড্যাশবোর্ড</button>
        <button class="menu-button" id="nav-forms"><i class="fas fa-file-alt"></i> ফর্মস</button>
        <button class="menu-button" id="nav-submit"><i class="fas fa-credit-card"></i> ট্রানজেকশন</button>
        <button class="menu-button" id="nav-filter"><i class="fas fa-search"></i> ফিল্টার</button>
        <button class="menu-button" id="nav-settings"><i class="fas fa-cog"></i> সেটিংস</button>
      </div>
    </nav>
  </aside>

  <main id="content">
    <p>লোড হচ্ছে...</p>
  </main>

  <!-- JS files -->
  <script src="main.js"></script>
  <script src="monthday.js"></script>
  <script src="transactionfrom.js"></script>
  <script src="from.js"></script>
  <script src="dashboard.js"></script>
  <script src="proflie.js"></script>

  <!-- 🔧 inline script — শুধু UI (auth listener বাদ দেওয়া) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle  = document.getElementById('menu-toggle');
      const sidebar     = document.getElementById('sidebar');
      const backdrop    = document.getElementById('sidebar-backdrop');
      const menuButtons = document.querySelectorAll('.menu-button');
      const mobileTitle = document.querySelector('.mobile-title');
      const content     = document.getElementById('content');

      const sectionTitles = {
        'nav-dashboard': 'ড্যাশবোর্ড',
        'nav-forms':     'ফর্মস',
        'nav-submit':    'ট্রানজেকশন',
        'nav-filter':    'ফিল্টার',
        'nav-settings':  'সেটিংস'
      };

      function toggleMenu() {
        if (sidebar)   sidebar.classList.toggle('active');
        if (backdrop)  backdrop.classList.toggle('active');
      }

      if (menuToggle) menuToggle.addEventListener('click', toggleMenu);
      if (backdrop)   backdrop.addEventListener('click', toggleMenu);

      menuButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          if (mobileTitle && sectionTitles[btn.id]) {
            mobileTitle.textContent = sectionTitles[btn.id];
          }
          if (window.innerWidth <= 768) toggleMenu();
        });
      });

      if (content && mobileTitle) {
        const syncTitle = () => {
          const titleEl = content.querySelector('.titel');
          if (titleEl) {
            const text = titleEl.textContent.trim();
            if (text) mobileTitle.textContent = text;
          }
        };
        syncTitle();
        try {
          new MutationObserver(syncTitle).observe(content, { childList: true, subtree: true });
        } catch (e) {
          console.warn('MutationObserver failed:', e);
        }
      }

      // Theme logic
      const themeToggle = document.getElementById('theme-toggle');
      const themeLabel  = document.getElementById('theme-label');
      const themeMeta   = document.getElementById('theme-color-meta');

      if (themeToggle && document.body) {
        let savedTheme = 'default';
        try { savedTheme = localStorage.getItem('appTheme') || 'default'; } catch (e) { }

        if (savedTheme === 'dark') {
          document.body.classList.add('dark-theme');
          themeToggle.checked = true;
          if (themeLabel) themeLabel.textContent = 'ডার্ক থিম';
          if (themeMeta) themeMeta.content = '#0f172a';
        }

        themeToggle.addEventListener('change', (e) => {
          if (e.target.checked) {
            document.body.classList.add('dark-theme');
            try { localStorage.setItem('appTheme', 'dark'); } catch (err) {}
            if (themeLabel) themeLabel.textContent = 'ডার্ক থিম';
            if (themeMeta) themeMeta.content = '#0f172a';
          } else {
            document.body.classList.remove('dark-theme');
            try { localStorage.setItem('appTheme', 'default'); } catch (err) {}
            if (themeLabel) themeLabel.textContent = 'ডিফল্ট থিম';
            if (themeMeta) themeMeta.content = '#3b82f6';
          }
        });
      }
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
